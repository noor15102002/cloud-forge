name: CloudForge Verification
description: Verify a containerized application in an ephemeral k3d cluster and upload deterministic reports.
author: CloudForge

branding:
  icon: shield
  color: blue

inputs:
  release-version:
    description: Qualified release asset version for an external full-commit Action pin.
    required: false
    default: v0.1.0-alpha.1
  candidate-path:
    description: Internal qualification input; directory containing the already-built candidate archive, release.json and checksums.txt.
    required: false
    default: ""
  candidate-version:
    description: Expected candidate version; required with candidate-path.
    required: false
    default: ""
  candidate-commit:
    description: Expected full candidate source commit; required with candidate-path.
    required: false
    default: ""
  candidate-date:
    description: Expected candidate UTC build date; required with candidate-path.
    required: false
    default: ""
  candidate-sha256:
    description: Expected candidate archive SHA-256; required with candidate-path.
    required: false
    default: ""
  path:
    description: Application directory, or repository boundary when build selection is configured; relative to the GitHub workspace.
    required: false
    default: .
  config-path:
    description: Optional configuration file relative to the GitHub workspace. Build paths are relative to path, not this file.
    required: false
    default: ""
  baseline-path:
    description: Explicit local v1alpha1, v1alpha2, v1alpha3, v1alpha4, v1alpha5, v1alpha6, v1alpha7 or v1alpha8 verification JSON baseline.
    required: false
    default: ""
  baseline-run-id:
    description: Trusted workflow run ID containing the configured baseline artifact.
    required: false
    default: ""
  baseline-artifact-name:
    description: Artifact name to download when baseline-run-id is set.
    required: false
    default: cloudforge-verification
  github-token:
    description: Read-only token used only to download a configured baseline run artifact.
    required: false
    default: ""
  artifact-name:
    description: Name for the uploaded JSON and Markdown report artifact. Keep the default when using the bundled pull-request reporter.
    required: false
    default: cloudforge-verification
  upload-artifact:
    description: Upload reports immediately; qualification can defer upload until independent cleanup.
    required: false
    default: "true"
  retention-days:
    description: Number of days to retain the report artifact.
    required: false
    default: "14"

outputs:
  report-directory:
    description: Directory containing the retained native output and rendered reports.
    value: ${{ steps.verify.outputs.report-directory }}
  report-json:
    description: Absolute path to the canonical JSON report.
    value: ${{ steps.verify.outputs.report-json }}
  report-markdown:
    description: Absolute path to the sanitized Markdown report.
    value: ${{ steps.verify.outputs.report-markdown }}
  binary:
    description: Absolute path to the installed CloudForge binary. Released and candidate runs never rebuild it.
    value: ${{ steps.build.outputs.binary }}
  exit-code:
    description: CloudForge verification exit code.
    value: ${{ steps.verify.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Validate action inputs
      id: inputs
      shell: bash
      env:
        CLOUDFORGE_APPLICATION_PATH: ${{ inputs.path }}
        CLOUDFORGE_CONFIG_PATH: ${{ inputs.config-path }}
        CLOUDFORGE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CLOUDFORGE_BASELINE_ARTIFACT_NAME: ${{ inputs.baseline-artifact-name }}
        CLOUDFORGE_BASELINE_PATH: ${{ inputs.baseline-path }}
        CLOUDFORGE_BASELINE_RUN_ID: ${{ inputs.baseline-run-id }}
        CLOUDFORGE_HAS_GITHUB_TOKEN: ${{ inputs.github-token != '' }}
        CLOUDFORGE_RETENTION_DAYS: ${{ inputs.retention-days }}
        CLOUDFORGE_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate-action-inputs.sh"

    - name: Set up Go
      if: ${{ inputs.candidate-path == '' && github.action_ref == '' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.1
        cache: false

    - name: Install pinned runtime tools
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh" "$RUNNER_TEMP/cloudforge-tools"

    - name: Prepare isolated baseline directory
      if: ${{ inputs.baseline-run-id != '' }}
      id: baseline-directory
      shell: bash
      run: printf 'path=%s\n' "$(mktemp -d "$RUNNER_TEMP/cloudforge-baseline.XXXXXX")" >> "$GITHUB_OUTPUT"

    - name: Download configured baseline artifact
      if: ${{ inputs.baseline-run-id != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.baseline-artifact-name }}
        path: ${{ steps.baseline-directory.outputs.path }}
        github-token: ${{ inputs.github-token }}
        run-id: ${{ inputs.baseline-run-id }}

    - name: Resolve baseline
      id: baseline
      shell: bash
      env:
        CLOUDFORGE_BASELINE_PATH: ${{ inputs.baseline-path }}
        CLOUDFORGE_BASELINE_RUN_ID: ${{ inputs.baseline-run-id }}
        CLOUDFORGE_BASELINE_DIRECTORY: ${{ steps.baseline-directory.outputs.path }}
      run: |
        set -euo pipefail
        baseline="$CLOUDFORGE_BASELINE_PATH"
        if [ -n "$CLOUDFORGE_BASELINE_RUN_ID" ]; then
          baseline="$CLOUDFORGE_BASELINE_DIRECTORY/verification.json"
        fi
        if [ -n "$baseline" ] && [ ! -f "$baseline" ]; then
          echo "Configured CloudForge baseline does not exist: $baseline" >&2
          exit 2
        fi
        echo "path=$baseline" >> "$GITHUB_OUTPUT"

    - name: Install and verify the CloudForge candidate
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CLOUDFORGE_ACTION_REF: ${{ github.action_ref }}
        CLOUDFORGE_RELEASE_VERSION: ${{ inputs.release-version }}
        CLOUDFORGE_CANDIDATE_PATH: ${{ inputs.candidate-path }}
        CLOUDFORGE_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
        CLOUDFORGE_CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
        CLOUDFORGE_CANDIDATE_DATE: ${{ inputs.candidate-date }}
        CLOUDFORGE_CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-binary.sh"

    - name: Verify application and render reports
      id: verify
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CLOUDFORGE_APPLICATION_PATH: ${{ steps.inputs.outputs.application-path }}
        CLOUDFORGE_CONFIG_PATH: ${{ steps.inputs.outputs.config-path }}
        CLOUDFORGE_BASELINE_PATH: ${{ steps.baseline.outputs.path }}
        CLOUDFORGE_BINARY: ${{ steps.build.outputs.binary }}
        CLOUDFORGE_QUALIFY: ${{ inputs.upload-artifact == 'false' }}
      run: |
        set -euo pipefail
        report_dir="$(mktemp -d "$RUNNER_TEMP/cloudforge-report.XXXXXX")"
        json_report="$report_dir/verification.json"
        markdown_report="$report_dir/verification.md"
        stderr_report="$report_dir/verification.stderr.txt"
        echo "report-directory=$report_dir" >> "$GITHUB_OUTPUT"
        if [ "$CLOUDFORGE_QUALIFY" = true ]; then
          python3 "$GITHUB_ACTION_PATH/scripts/qualification-action.py" start --binary "$CLOUDFORGE_BINARY" --evidence "$report_dir" --records "$report_dir/qualification-records"
        fi
        arguments=(verify "$CLOUDFORGE_APPLICATION_PATH" --format json)
        if [ -n "$CLOUDFORGE_CONFIG_PATH" ]; then
          arguments+=(--config "$CLOUDFORGE_CONFIG_PATH")
        fi
        if [ -n "$CLOUDFORGE_BASELINE_PATH" ]; then
          arguments+=(--baseline "$CLOUDFORGE_BASELINE_PATH")
        fi
        set +e
        if [ "$CLOUDFORGE_QUALIFY" = true ]; then
          python3 "$GITHUB_ACTION_PATH/scripts/qualification-native.py" --report "$json_report" --timeout 1800 -- "$CLOUDFORGE_BINARY" "${arguments[@]}"
          status="$?"
        else
          python3 "$GITHUB_ACTION_PATH/scripts/qualification-observe.py" start "$json_report"
          "$CLOUDFORGE_BINARY" "${arguments[@]}" > "$json_report" 2> "$stderr_report"
          status="$?"
          python3 "$GITHUB_ACTION_PATH/scripts/qualification-observe.py" finish "$json_report" "$status"
        fi
        set -e
        "$CLOUDFORGE_BINARY" version --format json > "$report_dir/verifier.json"
        candidate_record="$(dirname "$CLOUDFORGE_BINARY")/installation.json"
        if [ -f "$candidate_record" ]; then
          cp "$candidate_record" "$report_dir/candidate.json"
        fi
        if [ -s "$json_report" ]; then
          if ! "$CLOUDFORGE_BINARY" report "$json_report" --format markdown > "$markdown_report"; then
            status=2
            markdown_report=""
          fi
          "$CLOUDFORGE_BINARY" report "$json_report" --format text || status=2
        else
          json_report=""
          markdown_report=""
        fi
        echo "report-json=$json_report" >> "$GITHUB_OUTPUT"
        echo "report-markdown=$markdown_report" >> "$GITHUB_OUTPUT"
        echo "report-directory=$report_dir" >> "$GITHUB_OUTPUT"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ "$CLOUDFORGE_QUALIFY" = true ]; then
          outcome=failure
          if [ "$status" = 0 ]; then outcome=success; fi
          python3 "$GITHUB_ACTION_PATH/scripts/qualification-action.py" finish --binary "$CLOUDFORGE_BINARY" --evidence "$report_dir" --records "$report_dir/qualification-records" --outcome "$outcome"
        fi

    - name: Upload verification reports
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.verify.outputs.report-directory != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.verify.outputs.report-directory }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Apply verification result
      if: ${{ always() }}
      shell: bash
      env:
        CLOUDFORGE_EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
      run: |
        set -euo pipefail
        exit "${CLOUDFORGE_EXIT_CODE:-2}"
