apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-rollout-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-rollout-api
  template:
    metadata:
      labels:
        app: broken-rollout-api
    spec:
      containers:
        - name: api
          image: broken-rollout-api:test
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
