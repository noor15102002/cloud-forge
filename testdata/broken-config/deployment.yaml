apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-api
  template:
    metadata:
      labels:
        app: broken-api
    spec:
      containers:
        - name: api
          image: broken-api:test
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: broken-api
spec:
  selector:
    app: broken-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broken-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ""
  minReplicas: 2
  maxReplicas: 1
