apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-a
spec:
  selector:
    matchLabels: {app: api-a}
  template:
    metadata:
      labels: {app: api-a}
    spec:
      containers:
        - name: api
          image: api-a:test
          ports:
            - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b
spec:
  selector:
    matchLabels: {app: api-b}
  template:
    metadata:
      labels: {app: api-b}
    spec:
      containers:
        - name: api
          image: api-b:test
          ports:
            - containerPort: 8080

