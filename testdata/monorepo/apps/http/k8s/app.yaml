apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorepo-http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monorepo-http
  template:
    metadata:
      labels:
        app: monorepo-http
    spec:
      containers:
        - name: api
          image: cloudforge-node:test
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 1
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monorepo-http
spec:
  selector:
    app: monorepo-http
  ports:
    - name: http
      port: 80
      targetPort: http
