name: Install exact CloudForge candidate
description: Download and verify the shared Linux/amd64 candidate without rebuilding.
inputs:
  artifact:
    required: true
    description: Candidate artifact from this qualification run.
  version:
    required: true
    description: Expected release version.
  commit:
    required: true
    description: Expected full source commit.
  date:
    required: true
    description: Expected UTC build date.
  sha256:
    required: true
    description: Expected archive SHA-256.
outputs:
  binary:
    description: Installed candidate executable.
    value: ${{ steps.install.outputs.binary }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/candidate-release
    - id: install
      shell: bash
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
        CANDIDATE_COMMIT: ${{ inputs.commit }}
        CANDIDATE_DATE: ${{ inputs.date }}
        CANDIDATE_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        binary="$(python3 scripts/install-candidate.py "$RUNNER_TEMP/candidate-release" "$RUNNER_TEMP/candidate-install" \
          --version "$CANDIDATE_VERSION" --commit "$CANDIDATE_COMMIT" --date "$CANDIDATE_DATE" --sha256 "$CANDIDATE_SHA256")"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
    - name: Install pinned runtime tools
      shell: bash
      run: bash scripts/install-tools.sh "$RUNNER_TEMP/cloudforge-tools"
