name: CloudForge Pull Request Report
description: Validate a CloudForge JSON artifact and update one pull-request comment.

inputs:
  report-path:
    description: Path to the untrusted verification.json artifact.
    required: true
  pull-request-number:
    description: Pull request that receives the report.
    required: true
  github-token:
    description: Token with pull-requests write permission.
    required: true

  candidate-path:
    description: Internal qualification directory containing the verified canonical candidate release.
    required: false
    default: ""
  candidate-version:
    description: Expected candidate version, required with candidate-path.
    required: false
    default: ""
  candidate-commit:
    description: Expected full candidate commit, required with candidate-path.
    required: false
    default: ""
  candidate-date:
    description: Expected deterministic candidate date, required with candidate-path.
    required: false
    default: ""
  candidate-sha256:
    description: Expected canonical archive SHA-256, required with candidate-path.
    required: false
    default: ""
  qualification-scope:
    description: Internal live qualification scope; ordinary bot reports are excluded when set.
    required: false
    default: ""
  artifact-url:
    description: Trusted workflow run URL containing the full qualification evidence.
    required: false
    default: ""

outputs:
  comment-id:
    description: ID of the created or updated comment.
    value: ${{ steps.comment.outputs.result }}

  binary:
    description: Trusted renderer executable; qualification installs the canonical candidate.
    value: ${{ steps.build.outputs.binary }}
  report-markdown:
    description: Validated Markdown rendered by the selected binary.
    value: ${{ steps.render.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Set up Go
      if: ${{ inputs.candidate-path == '' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.1
        cache: false

    - name: Prepare trusted report renderer
      id: build
      shell: bash
      env:
        CANDIDATE_PATH: ${{ inputs.candidate-path }}
        CANDIDATE_VERSION: ${{ inputs.candidate-version }}
        CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
        CANDIDATE_DATE: ${{ inputs.candidate-date }}
        CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
        CLOUDFORGE_REPORTER_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        binary="$RUNNER_TEMP/cloudforge-report-renderer"
        cd "$CLOUDFORGE_REPORTER_ACTION_PATH/../../.."
        if [ -n "$CANDIDATE_PATH" ]; then
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT" || {
            echo 'Candidate and report Action source revisions differ.' >&2
            exit 2
          }
          binary="$(python3 scripts/install-candidate.py "$CANDIDATE_PATH" "$RUNNER_TEMP/cloudforge-report-candidate" \
            --version "$CANDIDATE_VERSION" --commit "$CANDIDATE_COMMIT" --date "$CANDIDATE_DATE" \
            --sha256 "$CANDIDATE_SHA256" --require-enriched-manifest)"
        else
          go build -trimpath -o "$binary" ./cmd/cloudforge
        fi
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Validate and render untrusted JSON
      id: render
      shell: bash
      env:
        CLOUDFORGE_BINARY: ${{ steps.build.outputs.binary }}
        CLOUDFORGE_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        markdown="$RUNNER_TEMP/cloudforge-pr-report.md"
        "$CLOUDFORGE_BINARY" report "$CLOUDFORGE_REPORT_PATH" --format markdown > "$markdown"
        echo "markdown=$markdown" >> "$GITHUB_OUTPUT"

    - name: Create or update the CloudForge comment
      id: comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CLOUDFORGE_MARKDOWN_PATH: ${{ steps.render.outputs.markdown }}
        CLOUDFORGE_PR_NUMBER: ${{ inputs.pull-request-number }}
        CLOUDFORGE_QUALIFICATION_SCOPE: ${{ inputs.qualification-scope }}
        CLOUDFORGE_ARTIFACT_URL: ${{ inputs.artifact-url }}
        CLOUDFORGE_REPORTER_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const reporter = require(`${process.env.CLOUDFORGE_REPORTER_ACTION_PATH}/comment.cjs`)
          const body = require('node:fs').readFileSync(process.env.CLOUDFORGE_MARKDOWN_PATH, 'utf8')
          return await reporter.updateComment({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            pullRequestNumber: process.env.CLOUDFORGE_PR_NUMBER,
            body,
            qualificationScope: process.env.CLOUDFORGE_QUALIFICATION_SCOPE,
            artifactURL: process.env.CLOUDFORGE_ARTIFACT_URL || context.payload.workflow_run?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          })
