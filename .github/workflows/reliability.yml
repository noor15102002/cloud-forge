      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Install pinned tools
        run: bash scripts/install-tools.sh "$RUNNER_TEMP/cloudforge-tools"
      - name: Capture independent cleanup baseline
        run: python3 scripts/pilot-cleanup-check.py --capture-baseline "$RUNNER_TEMP/cleanup-baseline.json"
      - name: Compare identical behavior across one and two replicas
        run: |
          go build -trimpath -o /tmp/cloudforge ./cmd/cloudforge
          python3 scripts/qualification-run.py --case "reliability" --binary /tmp/cloudforge --evidence "$RUNNER_TEMP/reliability" --records "$RUNNER_TEMP/qualification-records" --timeout 3000 -- python3 scripts/pilot-reliability.py /tmp/cloudforge "$RUNNER_TEMP/reliability"
