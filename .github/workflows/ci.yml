name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal pkg)"
      - name: Test
        run: go test -race ./...
      - name: Test pull request reporter
        run: node --test .github/actions/report/comment.test.cjs
      - name: Test Action input validation
        run: bash scripts/test-action-inputs.sh
      - name: Vet
        run: go vet ./...
      - name: Install analysis tools
        run: |
          # Pinned post-v2.9 commit includes Go 1.27 export-data support.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@5573d88ff78251eba05ca31a1d5f530f3b02eb89
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
      - name: Lint
        run: golangci-lint run
      - name: Validate GitHub Actions
        run: actionlint
      - name: Check known Go vulnerabilities
        run: govulncheck ./...
      - name: Build
        run: go build ./cmd/cloudforge
