name: Worker heartbeat runtime

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [healthy, never, stale, frozen, future, malformed, exit, first-pod-only, fail-second-start, cancel-startup, cancel-recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Reserve disposable runner storage
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install pinned runtime tools
        run: bash scripts/install-tools.sh "$RUNNER_TEMP/cloudforge-tools"
      - name: Check the bounded observer and public fixture
        run: |
          python3 scripts/pilot-worker.py --self-test
          node --check testdata/healthy-worker/worker.js
      - name: Qualify actual worker lifecycle evidence
        env:
          WORKER_CASE: ${{ matrix.case }}
        run: |
          go build -trimpath -o /tmp/cloudforge ./cmd/cloudforge
          python3 scripts/pilot-worker.py /tmp/cloudforge "$RUNNER_TEMP/worker-evidence" --run --case "$WORKER_CASE"
      - name: Preserve exact CLI output and cleanup observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ matrix.case }}
          path: ${{ runner.temp }}/worker-evidence
      - name: Check owned resource cleanup
        if: always()
        run: bash scripts/pilot-cleanup-check.sh
