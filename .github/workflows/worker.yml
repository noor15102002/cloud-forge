name: Worker heartbeat runtime

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CLOUDFORGE_QUALIFICATION_CASE: worker-${{ matrix.case }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [healthy, never, stale, frozen, future, malformed, exit, first-pod-only, fail-second-start, cancel-startup, cancel-recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Reserve disposable runner storage
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install pinned runtime tools
        run: bash scripts/install-tools.sh "$RUNNER_TEMP/cloudforge-tools"
      - name: Capture independent cleanup baseline
        run: python3 scripts/pilot-cleanup-check.py --capture-baseline "$RUNNER_TEMP/cleanup-baseline.json"
      - name: Check the bounded observer and public fixture
        run: |
          python3 scripts/pilot-worker.py --self-test
          node --check testdata/healthy-worker/worker.js
      - name: Qualify actual worker lifecycle evidence
        env:
          WORKER_CASE: ${{ matrix.case }}
        run: |
          go build -trimpath -o /tmp/cloudforge ./cmd/cloudforge
          python3 scripts/qualification-run.py --case "worker-$WORKER_CASE" --binary /tmp/cloudforge --evidence "$RUNNER_TEMP/worker-evidence" --records "$RUNNER_TEMP/qualification-records" --timeout 2100 -- python3 scripts/pilot-worker.py /tmp/cloudforge "$RUNNER_TEMP/worker-evidence" --run --case "$WORKER_CASE"
      - name: Independently check cleanup before any upload
        if: always()
        timeout-minutes: 3
        run: python3 scripts/pilot-cleanup-check.py --baseline "$RUNNER_TEMP/cleanup-baseline.json" --output "$RUNNER_TEMP/cleanup.json"
      - name: Preserve independent qualification layers — compact result before uploads
        if: always()
        timeout-minutes: 1
        env:
          RECORDS: ${{ runner.temp }}/qualification-records
          CLEANUP: ${{ runner.temp }}/cleanup.json
          EVIDENCE: ${{ runner.temp }}/worker-evidence
        run: python3 scripts/finish-qualification.py --records "$RECORDS" --cleanup "$CLEANUP" --output "$RECORDS/initial" --stage-evidence "$EVIDENCE"
      - name: Preserve small result first
        id: q17_small
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-record-initial
          path: ${{ runner.temp }}/qualification-records/initial
          if-no-files-found: error
          retention-days: 90
      - name: Preserve full raw attempt after cleanup
        id: q17_bulk
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Record actual bulk and initial upload outcomes
        if: always()
        timeout-minutes: 1
        env:
          RECORDS: ${{ runner.temp }}/qualification-records
          CLEANUP: ${{ runner.temp }}/cleanup.json
          BULK: ${{ steps.q17_bulk.outcome }}
          SMALL: ${{ steps.q17_small.outcome }}
        run: python3 scripts/finish-qualification.py --records "$RECORDS" --cleanup "$CLEANUP" --output "$RECORDS/final" --bulk-outcome "$BULK" --small-outcome "$SMALL"
      - name: Preserve final upload outcome separately
        id: q17_final
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}-record-final
          path: ${{ runner.temp }}/qualification-records/final
          if-no-files-found: error
          retention-days: 90
      - name: Apply qualification and preservation gates
        if: always()
        timeout-minutes: 1
        env:
          RECORDS: ${{ runner.temp }}/qualification-records
          CLEANUP: ${{ runner.temp }}/cleanup.json
          BULK: ${{ steps.q17_bulk.outcome }}
          SMALL: ${{ steps.q17_small.outcome }}
          FINAL: ${{ steps.q17_final.outcome }}
        run: |
          python3 scripts/finish-qualification.py --records "$RECORDS" --cleanup "$CLEANUP" --output "$RECORDS/gate" --bulk-outcome "$BULK" --small-outcome "$SMALL" --gate
          if [ "$FINAL" != success ]; then
            echo '::error::Final small artifact was not preserved; native and cleanup outcomes remain unchanged.'
            exit 1
          fi
